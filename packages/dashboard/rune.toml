name = "@rune/dashboard"
version = "0.1.1"
language = "typescript"
entry = "index.ts"
description = "React operator console with live Paper metrics, Rune telemetry, and extensible dashboard tools."
license = "Apache-2.0"

[publish]
include = ["*.ts", "*.tsx", "dashboard.css", "web/*", "rune.toml", "package.json", "README.md"]

[capabilities]
required = ["host:bukkit", "host:http"]

[dependencies]
"@rune/web-auth" = "^0.1.1"
"@rune/storage" = "^0.1.2"
