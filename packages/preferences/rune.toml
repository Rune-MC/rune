name = "@rune/preferences"
version = "0.1.5"
language = "typescript"
entry = "index.ts"
description = "Persistent per-player toggle settings with a service for other Runes."
license = "Apache-2.0"

[publish]
include = ["*.ts", "*.tsx", "rune.toml", "rune.jsonc", "package.json", "README.md"]

[capabilities]
required = ["host:bukkit"]

[dependencies]
"@rune/storage" = "^0.1.1"
