name = "@rune/homes"
version = "0.1.5"
language = "typescript"
entry = "index.ts"
description = "Private homes with persistence, a configurable limit, and a teleport cooldown."
license = "Apache-2.0"

[publish]
include = ["*.ts", "*.tsx", "rune.toml", "rune.jsonc", "package.json", "README.md"]

[capabilities]
required = ["host:bukkit"]

[dependencies]
"@rune/positions" = "^0.1.0"
"@rune/cooldowns" = "^0.1.0"
"@rune/storage" = "^0.1.1"
