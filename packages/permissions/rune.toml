name = "@rune/permissions"
version = "0.3.5"
language = "typescript"
entry = "index.ts"
description = "In-game Permissions Manager with scoped rules, temporary ranks, promotion tracks, Adventure player labels, and per-channel chat formatting."
license = "Apache-2.0"

[publish]
include = ["*.ts", "commands/*.ts", "gui/*.ts", "rune.toml", "rune.jsonc", "package.json", "README.md"]

[capabilities]
required = ["host:bukkit"]

[dependencies]
"@rune/storage" = "^0.1.1"
"@rune/paper-ui" = "^0.1.0"
