name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Where pre-built libnode tarballs live. Override per-fork via repo
# variable LIBNODE_BASE_URL if you host them somewhere else.
env:
  RUNE_NODE_VERSION: "22.11.0"
  LIBNODE_BASE_URL: ${{ vars.LIBNODE_BASE_URL || 'https://github.com/Rune-MC/libnode-prebuilts/releases/download' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: macos-arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + libnode
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/libnode-cache
          key: ${{ runner.os }}-cargo-${{ env.RUNE_NODE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUNE_NODE_VERSION }}-

      - name: Install LLVM (Windows)
        if: matrix.target == 'windows-x64'
        run: choco install llvm --no-progress -y

      - name: Fetch libnode
        run: node tools/fetch-libnode.mjs --platform ${{ matrix.target }} --base-url ${{ env.LIBNODE_BASE_URL }}

      - name: Install JS deps
        run: pnpm install --frozen-lockfile=false

      - name: turbo build
        run: pnpm build
        env:
          RUNE_NODE_ROOT: ${{ github.workspace }}/tools/libnode-cache/v${{ env.RUNE_NODE_VERSION }}/${{ matrix.target }}
