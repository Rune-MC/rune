name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: "Release tag (e.g. v0.2.0). Leave blank to use the pushed tag."
        required: false

permissions:
  contents: write   # creating GH Releases + uploading artifacts

env:
  RUNE_NODE_VERSION: "22.20.0"
  LIBNODE_BASE_URL: ${{ vars.LIBNODE_BASE_URL || 'https://github.com/Rune-MC/libnode-prebuilts/releases/download' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            jar_suffix: windows-x64
          - target: linux-x64
            runner: ubuntu-latest
            jar_suffix: linux-x64
          - target: macos-arm64
            runner: macos-14
            jar_suffix: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (Windows)
        if: matrix.target == 'windows-x64'
        run: choco install llvm --no-progress -y

      # Don't start a release build (or upload artifacts) if the prebuilt
      # for this platform doesn't exist in Rune-MC/libnode-prebuilts. Fail
      # at minute 0 with a clear pointer instead of mid-cargo-build.
      - name: Verify libnode prebuilt is published
        shell: bash
        run: |
          url="${{ env.LIBNODE_BASE_URL }}/v${{ env.RUNE_NODE_VERSION }}/libnode-${{ matrix.target }}.tar.gz"
          echo "Checking $url"
          status=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
          if [ "$status" != "200" ]; then
            echo "::error::No libnode prebuilt for v${RUNE_NODE_VERSION} / ${{ matrix.target }} (HTTP $status)."
            echo "::error::Expected URL: $url"
            echo "::error::Fix: cut the v${RUNE_NODE_VERSION} release in Rune-MC/libnode-prebuilts first."
            exit 1
          fi

      - name: Fetch libnode
        run: node tools/fetch-libnode.mjs --platform ${{ matrix.target }} --base-url ${{ env.LIBNODE_BASE_URL }}

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: build plugin jar
        run: pnpm build
        env:
          RUNE_NODE_ROOT: ${{ github.workspace }}/tools/libnode-cache/v${{ env.RUNE_NODE_VERSION }}/${{ matrix.target }}

      - name: rename jar with platform suffix
        id: jar
        shell: bash
        run: |
          set -e
          src=$(ls plugin/build/libs/rune-*.jar | head -1)
          [ -n "$src" ] || { echo "no rune jar found"; exit 1; }
          version=$(basename "$src" .jar | sed 's/^rune-//')
          out="plugin/build/libs/rune-${version}-${{ matrix.jar_suffix }}.jar"
          mv "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: bundle install scripts + templates
        run: |
          mkdir -p release-bundle/install
          cp -r install/* release-bundle/install/
          cp artifacts/*.jar release-bundle/install/
          (cd release-bundle && zip -r "../rune-install-${{ github.ref_name }}.zip" install)

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: Rune ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.jar
            rune-install-${{ github.ref_name }}.zip
          body: |
            ## Install

            **Quick start:**
            1. Download `rune-install-${{ github.ref_name }}.zip` and unzip.
            2. Run the platform-appropriate installer:
               ```powershell
               # Windows
               .\install\install-server.ps1 -ServerPath C:\my-mc
               ```
               ```bash
               # Linux/macOS
               ./install/install-server.sh --server ~/my-mc
               ```

            **Or just the jar:**
            * Windows: `rune-${{ github.ref_name }}-windows-x64.jar`
            * Linux:   `rune-${{ github.ref_name }}-linux-x64.jar`
            * macOS:   `rune-${{ github.ref_name }}-macos-arm64.jar`

            Drop the jar into your Paper server's `plugins/` directory and restart.
            The jar contains everything (loader DLL + libnode), no extra downloads needed.
